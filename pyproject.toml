[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bass-lv"
version = "0.1.0"
description = "Bass local-volatility model with multiple marginals: calibration, exact Monte Carlo and vega hedging (paper replication)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Denys Shkola" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pandas>=3.0",
]
keywords = ["local volatility", "martingale optimal transport", "Bass martingale", "calibration", "Monte Carlo", "quantitative finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
notebooks = ["matplotlib>=3.8", "jupyterlab>=4", "ipykernel>=6"]

[project.urls]
Repository = "https://github.com/AlphaShk/bass-lv-calibration"
Paper = "https://ssrn.com/abstract=3853085"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.isort]
known-first-party = ["bass_lv"]
known-local-folder = ["helpers"]
